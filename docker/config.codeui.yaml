app:
  name: codeui
  version: "0.2.32"

server:
  host: "0.0.0.0"
  port: 8088
  reload: false

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

codecollector:
  # В Docker три проекта лежат соседями, как в локальной разработке:
  # /home/stickt/llm/codecollector, /home/stickt/llm/codegenerator, /home/stickt/llm/codeui.
  root_dir: "../codecollector"
  python: "python"
  module: "codecollector"
  command_timeout_sec: 900
  runs_dir: ".runs"
  state_dir: ".state"
  workspaces_dir: ".workspaces"

requirements:
  sources:
    - id: "runtime"
      type: "json_dir"
      path: "/runtime/requirements"
      enabled: true

change_requests:
  storage_dir: "data/change_requests"

command_trace:
  enabled: true
  storage_dir: ".trace/codecollector_cli"
  save_stdout: true
  save_stderr: true
  filename_label_max_chars: 80

ui:
  poll_interval_ms: 1500
  show_raw_json: true
  show_debug_artifacts: true
  state_file: "data/ui_state.json"
