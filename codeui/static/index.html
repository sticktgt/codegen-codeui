<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>codeui</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-mark">◆</span><span>codeui</span></div>
    <nav class="main-nav">
      <button class="nav-item active" data-view="requirements-view">1. Требования</button>
      <button class="nav-item" data-view="requests-view">2. Запросы</button>
      <button class="nav-item" data-view="runs-view">3. Запуски</button>
      <button class="nav-item" data-view="project-schema-graph-view">Карта проекта</button>
      <button class="nav-item" data-view="project-schema-view">Схема проекта</button>
    </nav>
    <div class="status-pill" id="api-status">API</div>
  </header>

  <section class="context-bar" id="project-panel">
    <div class="field-row compact">
      <label>Проект</label>
      <select id="project-select"></select>
      <button class="btn small" id="show-register-project-btn">Добавить проект</button>
      <button class="btn small" id="reindex-project-btn">Обновить индекс</button>
      <button class="btn small danger" id="delete-project-btn">Удалить проект</button>
    </div>
    <div class="project-path" id="project-path">Проект не выбран</div>
    <div class="inline-form hidden" id="register-project-panel">
      <form id="register-project-form" class="project-register-form">
        <div class="form-row compact-field"><label>Путь к root-папке</label><input name="input_root" required placeholder="/home/stickt/llm/my_project"></div>
        <div class="form-row compact-field"><label>Название</label><input name="project_name" required placeholder="example_project"></div>
        <label class="checkbox-row compact-field"><input type="checkbox" name="full" checked> Полный rebuild индекса</label>
        <label class="checkbox-row compact-field"><input type="checkbox" name="skip_architecture_enrichment"> Пропустить LLM enrichment архитектуры</label>
        <div class="action-row compact-action"><button class="btn small primary" type="submit">Добавить проект</button></div>
      </form>
    </div>
    <div id="project-action-result" class="project-action-result hidden"></div>
  </section>

  <main class="layout">
    <section id="requirements-view" class="view active">
      <div class="toolbar-panel">
        <div class="field-row grow">
          <label>Файл требований</label>
          <input id="requirements-path-input" type="text" placeholder="/path/to/requirements.json">
          <button class="btn small" id="set-requirements-path-btn">Подключить</button>
          <button class="btn small" id="reload-requirements-btn">Обновить</button>
        </div>
      </div>
      <div class="split two-columns">
        <aside class="panel list-panel wide-list">
          <div class="panel-header compact-header">
            <h2>Список требований</h2>
            <span class="counter" id="requirements-count">0</span>
          </div>
          <div id="requirements-tree" class="tree-list"></div>
        </aside>
        <section class="panel detail-panel">
          <div id="requirement-detail" class="empty-state">Выберите требование слева.</div>
        </section>
      </div>
    </section>

    <section id="requests-view" class="view">
      <div class="split two-columns">
        <aside class="panel list-panel">
          <div class="panel-header compact-header">
            <h2>Запросы на изменение</h2>
            <span class="counter" id="cr-count">0</span>
          </div>
          <div id="cr-list" class="list"></div>
        </aside>
        <section class="panel detail-panel">
          <div id="cr-detail" class="empty-state">Выберите запрос или создайте его из требования.</div>
        </section>
      </div>
    </section>

    <section id="runs-view" class="view">
      <div class="split two-columns">
        <aside class="panel list-panel">
          <div class="panel-header compact-header">
            <h2>Запуски</h2>
            <span class="counter" id="runs-count">0</span>
            <button class="btn small" id="refresh-runs-btn">Обновить</button>
            <button class="btn small" id="show-all-runs-btn">Показать все</button>
          </div>
          <div id="run-list" class="list"></div>
        </aside>
        <section class="panel detail-panel">
          <div id="run-detail" class="empty-state">Выберите запуск.</div>
        </section>
      </div>
    </section>

    <section id="project-schema-view" class="view">
      <div class="panel project-schema-panel">
        <div class="panel-header compact-header">
          <h2>Схема проекта</h2>
          <span class="counter" id="project-schema-count">0 связей</span>
          <button class="btn small" id="refresh-project-schema-btn">Обновить</button>
        </div>
        <div id="project-schema-root" class="project-schema-root">
          <div class="empty-state">Выберите проект и файл требований.</div>
        </div>
      </div>
    </section>

    <section id="project-schema-graph-view" class="view">
      <div class="panel project-schema-panel">
        <div class="panel-header compact-header">
          <h2>Карта проекта</h2>
          <span class="counter" id="project-schema-graph-count">0 связей</span>
          <button class="btn small" id="refresh-project-schema-graph-btn">Обновить</button>
        </div>
        <div id="project-schema-graph-root" class="project-schema-root">
          <div class="empty-state">Выберите проект и файл требований.</div>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/project_schema_view.js"></script>
  <script src="/static/project_symbol_picker.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
